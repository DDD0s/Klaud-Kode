name: Komputer tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            Komputer/komputer-api/package-lock.json
            Komputer/kloud-kode-body/package-lock.json
      - name: Install API dependencies
        working-directory: Komputer/komputer-api
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The API tests run agy turns against a real workstation (Body) process.
      - name: Install workstation dependencies
        working-directory: Komputer/kloud-kode-body
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test API, harness round trips and verified HTTPS
        working-directory: Komputer/komputer-api
        run: npm test
      - name: Test workstation tools
        working-directory: Komputer/kloud-kode-body
        run: npm test
