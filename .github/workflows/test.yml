name: Komputer tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            Komputer/komputer-api/package-lock.json
            Komputer/kloud-kode-body/package-lock.json
      - name: Install API dependencies
        working-directory: Komputer/komputer-api
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The API tests run agy turns against a real workstation (Body) process.
      - name: Install workstation dependencies
        working-directory: Komputer/kloud-kode-body
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Ubuntu runners ship PowerShell 7; the Windows-computer tests run against it.
      - name: PowerShell version
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Test API, harness round trips and verified HTTPS
        working-directory: Komputer/komputer-api
        run: npm test
      - name: Test workstation tools
        working-directory: Komputer/kloud-kode-body
        run: npm test

  # The workstation on a real Windows host: Windows PowerShell 5.1, pwsh, cmd, Git Bash.
  workstation-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Komputer/kloud-kode-body/package-lock.json
      - name: Install workstation dependencies
        working-directory: Komputer/kloud-kode-body
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the Windows shells
        working-directory: Komputer/kloud-kode-body
        run: node --test test/windows-host.test.mjs

  # The Go rewrite lives beside the JavaScript implementation until it
  # passes the same behavior contracts; this job keeps it compiling and
  # tested on Linux and cross-compiled for Windows.
  go-rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: Komputer/go.mod
          cache: false
      - name: Vet Go rewrite
        working-directory: Komputer
        run: go vet ./...
      - name: Test Go rewrite
        working-directory: Komputer
        run: go test ./...
      - name: Build Linux and Windows binaries
        working-directory: Komputer
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/kloud-kode-linux ./cmd/kloud-kode
          GOOS=windows GOARCH=amd64 go build -o /tmp/kloud-kode-windows.exe ./cmd/kloud-kode
